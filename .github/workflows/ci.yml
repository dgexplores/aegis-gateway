name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q

  # THE DIFFERENTIATOR: a PR that degrades answer quality or lets an attack
  # leak cannot merge — evals and red-team are merge gates, not docs.
  security-and-quality-gates:
    runs-on: ubuntu-latest
    needs: quality
    env:
      AEGIS_TENANTS: "ci:${{ secrets.CI_TENANT_HASH || 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855' }}:chat+rag"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Red-team harness
        run: python scripts/redteam.py --corpus scripts/attacks.yaml
      - name: Eval regression gate
        run: python scripts/eval_gate.py --threshold 0.85

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aegis-gateway:${{ github.sha }} .
