apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-gateway
  labels: { app: aegis-gateway }
spec:
  replicas: 3
  selector:
    matchLabels: { app: aegis-gateway }
  template:
    metadata:
      labels: { app: aegis-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: gateway
          image: aegis-gateway:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - secretRef: { name: aegis-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
