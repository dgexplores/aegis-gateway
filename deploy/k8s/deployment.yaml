apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aegis-gateway
  labels: { app: aegis-gateway }
spec:
  # StatefulSet (not Deployment): each pod gets its OWN durable audit volume
  # via volumeClaimTemplates. The audit chain is a per-pod file — a shared
  # RWO PVC across Deployment replicas would leave all but one pod Pending,
  # and emptyDir evaporates evidence on reschedule. Per-pod chains stay
  # verifiable; cross-pod continuity comes from the S3 archive on rotation.
  serviceName: aegis-gateway
  replicas: 3
  updateStrategy: { type: RollingUpdate }
  selector:
    matchLabels: { app: aegis-gateway }
  # Per-pod durable audit volumes (audit-log-aegis-gateway-<ordinal>).
  # No static `volumes:` entry: StatefulSet provisions one claim per pod.
  volumeClaimTemplates:
    - metadata: { name: audit-log }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 10Gi }
  template:
    metadata:
      labels: { app: aegis-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: gateway
          image: ghcr.io/dgexplores/aegis-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - secretRef: { name: aegis-secrets }
          env:
            - { name: AEGIS_ENV, value: production }
            - { name: AEGIS_AUDIT_PATH, value: /data/audit.jsonl }
          volumeMounts:
            - { name: audit-log, mountPath: /data }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: aegis-gateway } }
