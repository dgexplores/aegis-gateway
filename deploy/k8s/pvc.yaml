# Reference template for the per-pod audit volumes. The StatefulSet in
# deployment.yaml provisions these automatically via volumeClaimTemplates
# (audit-log-aegis-gateway-<ordinal>); this file is kept for manual
# provisioning / storage-class customization only and is NOT in kustomization.
# Long-term, archive to S3 (PLAN Phase 2) and keep per-pod PVCs as a buffer.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aegis-audit-log
  labels: { app: aegis-gateway }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
