apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  labels: { app: aegis-gateway }
type: Opaque
stringData:
  # Fill via external-secrets / vault in prod. Never commit real values.
  AEGIS_AUDIT_HMAC_KEY: change-me-audit-hmac-key-min-32-chars
  AEGIS_VAULT_HMAC_KEY: change-me-vault-hmac-key-min-32-chars

  # REQUIRED — the gateway refuses to boot in production with no usable tenant,
  # and it refuses the public demo key hash. Mint one first:
  #   python scripts/gen_tenant.py --id acme --scopes chat+rag+admin
  # then paste the "AEGIS_TENANTS entry:" line from its output here.
  AEGIS_TENANTS: REPLACE_ME_run_scripts_gen_tenant.py

  # Change to "gmi,echo" (or "openai,echo") once a provider key is set below.
  # `echo` returns a deterministic non-answer; it keeps the platform live but
  # it is not a model, so leaving this as-is in production means silent quality
  # degradation rather than an error.
  AEGIS_PROVIDERS: echo

  # Backends: Redis is REQUIRED in production (gateway refuses to boot without
  # it — per-process fallback would multiply rate limits/budgets × replicas).
  # The bundled deploy/k8s/redis.yaml provides this Service; point at managed
  # Redis via external-secrets / vault before a real deploy.
  AEGIS_REDIS_URL: redis://aegis-redis:6379/0
  AEGIS_DATABASE_URL: ""
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: aegis-gateway }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: aegis-gateway } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: aegis-gateway }
spec:
  podSelector: { matchLabels: { app: aegis-gateway } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports:
        - { port: 443, protocol: TCP }
        - { port: 53, protocol: UDP }
        - { port: 6379, protocol: TCP }
        - { port: 5432, protocol: TCP }
