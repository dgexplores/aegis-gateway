apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  labels: { app: aegis-gateway }
type: Opaque
stringData:
  # Fill via external-secrets / vault in prod. Never commit real values.
  AEGIS_AUDIT_HMAC_KEY: change-me-audit-hmac-key-min-32-chars
  AEGIS_VAULT_HMAC_KEY: change-me-vault-hmac-key-min-32-chars

  # REQUIRED — the gateway refuses to boot in production with no usable tenant,
  # and it refuses the public demo key hash. Mint one first:
  #   python scripts/gen_tenant.py --id acme --scopes chat+rag+admin
  # then paste the "AEGIS_TENANTS entry:" line from its output here.
  AEGIS_TENANTS: REPLACE_ME_run_scripts_gen_tenant.py

  # Change to "gmi,echo" (or "openai,echo") once a provider key is set below.
  # `echo` returns a deterministic non-answer; it keeps the platform live but
  # it is not a model, so leaving this as-is in production means silent quality
  # degradation rather than an error.
  AEGIS_PROVIDERS: echo

  # Backends: Redis is REQUIRED in production (gateway refuses to boot without
  # it — per-process fallback would multiply rate limits/budgets × replicas).
  # The bundled deploy/k8s/redis.yaml provides this Service; point at managed
  # Redis via external-secrets / vault before a real deploy.
  AEGIS_REDIS_URL: redis://aegis-redis:6379/0
  AEGIS_DATABASE_URL: ""

  # Admin portal login — the operator signs in with an id and a password rather
  # than pasting a scoped key. UNCOMMENT AND FILL to enable it:
  #
  #   AEGIS_ADMIN_USERNAME: your-operator-id
  #   AEGIS_ADMIN_PASSWORD: <openssl rand -base64 32>
  #   # Signs the session cookie. Separate from the audit HMAC key so rotating
  #   # one does not invalidate evidence written under the other.
  #   AEGIS_ADMIN_SESSION_KEY: <openssl rand -base64 32>
  #   AEGIS_ADMIN_SESSION_TTL: "28800"
  #
  #   # Break-glass for the kill switch. Deliberately NOT the admin password:
  #   # otherwise compromising the portal is the same as being able to refuse
  #   # all traffic.
  #   AEGIS_BREAKGLASS_PASSWORD: <openssl rand -base64 32>
  #
  # They are commented out rather than shipped as placeholders on purpose. A
  # `REPLACE_ME_...` value in a Secret is a *published* password: the manifest,
  # this file and the source are all public, so shipping one puts a login form
  # in front of the controls that can pause every tenant, protected by a string
  # anyone can read. prod_guard.py fails the build on exactly that. Unset means
  # admin-scoped bearer tokens only, which is the pre-existing behaviour and is
  # safe — so "not set" is the correct state to ship, and the guard warns.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: aegis-gateway }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: aegis-gateway } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: aegis-gateway }
spec:
  podSelector: { matchLabels: { app: aegis-gateway } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports:
        - { port: 443, protocol: TCP }
        - { port: 53, protocol: UDP }
        - { port: 6379, protocol: TCP }
        - { port: 5432, protocol: TCP }
