apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  labels: { app: aegis-gateway }
type: Opaque
stringData:
  # Fill via external-secrets / vault in prod. Never commit real values.
  AEGIS_AUDIT_HMAC_KEY: change-me-audit-hmac-key-min-32-chars
  AEGIS_VAULT_HMAC_KEY: change-me-vault-hmac-key-min-32-chars
  AEGIS_TENANTS: demo:e3e18b6e9c3d49198e61396c5e4439668591ec224bac1ef1c2736661d80763ef:chat+rag
  AEGIS_PROVIDERS: echo
  # Optional backends (empty = memory mode). Prefer external managed DB in
  # prod via external-secrets; empty value keeps pods booting dependency-free.
  AEGIS_REDIS_URL: ""
  AEGIS_DATABASE_URL: ""
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: aegis-gateway }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: aegis-gateway } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: aegis-gateway }
spec:
  podSelector: { matchLabels: { app: aegis-gateway } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports:
        - { port: 443, protocol: TCP }
        - { port: 53, protocol: UDP }
        - { port: 6379, protocol: TCP }
        - { port: 5432, protocol: TCP }
