apiVersion: v1
kind: Service
metadata:
  name: aegis-gateway
spec:
  selector: { app: aegis-gateway }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-gateway
spec:
  scaleTargetRef:
    # Must match the workload kind in deployment.yaml. This read `Deployment`
    # while the workload is a StatefulSet, so the HPA never found its target and
    # autoscaling was silently dead.
    apiVersion: apps/v1
    kind: StatefulSet
    name: aegis-gateway
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
