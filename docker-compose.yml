services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      AEGIS_ENV: production
      AEGIS_AUDIT_HMAC_KEY: ${AEGIS_AUDIT_HMAC_KEY:?set in .env}
      AEGIS_VAULT_HMAC_KEY: ${AEGIS_VAULT_HMAC_KEY:?set in .env}
      AEGIS_TENANTS: ${AEGIS_TENANTS:?set in .env}
      AEGIS_PROVIDERS: ${AEGIS_PROVIDERS:-echo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - audit-log:/data
    working_dir: /data
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped

volumes:
  audit-log:
