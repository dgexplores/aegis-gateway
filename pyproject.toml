[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-gateway"
version = "0.1.0"
description = "Secure LLM gateway: prompt-injection defense, PII vault, hash-chained audit, hybrid RAG, eval-gated CI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "BLE", "ISC", "EXE"]
ignore = [
    # FastAPI's canonical DI idiom
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# asserts are the point of tests; dev bind-all is intentional for local runs
"tests/**" = ["S101"]
"src/aegis/config.py" = ["S104"]
# weighted regex table is naturally wide
"src/aegis/security/injection.py" = ["E501"]
# intentional blind catches: Redis degradation + eval error isolation
"src/aegis/ratelimit.py" = ["BLE001", "S110"]
"src/aegis/evals/runner.py" = ["BLE001"]
# KB_PASSWORD_RESET is sample documentation text, not a credential
"scripts/eval_gate.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
