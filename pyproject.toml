[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-gateway"
version = "0.1.0"
description = "Secure LLM gateway: prompt-injection defense, PII vault, hash-chained audit, hybrid RAG, eval-gated CI"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "redis>=5.0",
    # Not optional. Encrypted audit payloads are a headline claim — "prove what
    # the AI said" — and without this the payload copy falls back to base64, so
    # the feature is off by default and never exercised in CI. A security
    # primitive that silently degrades is worse than a heavier dependency.
    "cryptography>=42.0",
]

[project.scripts]
# PORT-aware entrypoint (see src/aegis/serve.py). Used as the container CMD so
# the same image works locally and on any platform that injects $PORT.
aegis-gateway = "aegis.serve:main"

[project.optional-dependencies]
archive = [
    # Required by AEGIS_AUDIT_S3_BUCKET. The archive path was documented in the
    # config, the runbook and ADR-7 with no way to install its dependency, so
    # setting the variable silently did nothing.
    "boto3>=1.34",
]
backends = [
    "psycopg[binary]>=3.1",
    # The deployed image installs this extra (see Dockerfile), and the free
    # tier keeps its only audit history in object storage — so the archive
    # dependency ships with the image, not as a forgotten extra.
    "boto3>=1.34",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "types-PyYAML>=6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "BLE", "ISC", "EXE"]
ignore = [
    # FastAPI's canonical DI idiom
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# asserts are the point of tests; dev bind-all is intentional for local runs
"tests/**" = ["S101"]
"src/aegis/config.py" = ["S104"]
# weighted regex table is naturally wide
"src/aegis/security/injection.py" = ["E501"]
# intentional blind catches: Redis degradation + eval error isolation
"src/aegis/ratelimit.py" = ["BLE001", "S110"]
"src/aegis/evals/runner.py" = ["BLE001"]
"src/aegis/api/routes.py" = ["BLE001", "S110"]
# KB_PASSWORD_RESET is sample documentation text, not a credential
"scripts/eval_gate.py" = ["S105"]
# The screenshot capture starts its own gateway on loopback and shells out to a
# fixed `sips` argv with no shell. That is the entire purpose of the file, and
# the alternative -- eight noqa comments -- is worse, because the formatter
# reflows these calls and slides the suppressions off the lines they explain.
"scripts/capture_shots.py" = ["S603", "S310", "S607"]
# The crash-safety test SIGKILLs a real gateway on loopback. Starting that
# process and reading it back over HTTP *is* the test; nothing here takes
# input from anywhere.
"tests/test_audit_crash_safety.py" = ["S603", "S310"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
